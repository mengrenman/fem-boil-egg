[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["egg_fem*"]

[project]
name = "egg_fem"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-fem>=9.0",
    "gmsh>=4.11",
    "meshio>=5.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Test suite: pip install -e ".[dev]"
dev = ["pytest>=7.0"]
# Running the notebooks (executing them headless with nbconvert as well as
# opening them in JupyterLab): pip install -e ".[notebooks]"
notebooks = ["jupyterlab", "nbconvert", "ipykernel"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
